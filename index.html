<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Acentúa · nivel inicial</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#14302f;--mut:#51696a;--teal:#0e6e6a;--onteal:#fff;--amb:#f5b301;--ambink:#2e2200;--line:#c9d7d3;--okbg:#dcf3e6;--oktx:#0d4f2c;--badbg:#fde3e1;--badtx:#7a1d1d;--sh:#b88500;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1b;--card:#162827;--ink:#e7f1ef;--mut:#9fb6b3;--teal:#4cc2b9;--onteal:#06201e;--amb:#ffc83d;--ambink:#2e2200;--line:#2f4846;--okbg:#14412b;--oktx:#bff0d5;--badbg:#4a1d1d;--badtx:#ffd0d0;--sh:#a67c00}}
:root[data-theme="dark"]{--bg:#0e1b1b;--card:#162827;--ink:#e7f1ef;--mut:#9fb6b3;--teal:#4cc2b9;--onteal:#06201e;--amb:#ffc83d;--ambink:#2e2200;--line:#2f4846;--okbg:#14412b;--oktx:#bff0d5;--badbg:#4a1d1d;--badtx:#ffd0d0;--sh:#a67c00}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 "Atkinson Hyperlegible",Verdana,sans-serif}
.app{max-width:640px;margin:0 auto;padding:16px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.hero{display:flex;align-items:center;gap:16px;margin:6px 0 16px}
.mark{flex:none;width:84px;height:84px;border-radius:22px;background:var(--teal);color:var(--amb);font:700 84px/1.05 Georgia,serif;text-align:center;overflow:hidden}
h1{margin:0;font-size:36px;line-height:1.05}
.hero p{margin:6px 0 0;color:var(--mut);font-size:16px}
.route{display:flex;gap:6px;margin:0 0 16px}
.route span{flex:1;border:2px solid var(--teal);border-radius:12px;padding:7px 6px;text-align:center;font-weight:700;font-size:14px;background:var(--card)}
.menu{display:grid;gap:10px}
.mc{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px 14px;width:100%}
.mc:hover{border-color:var(--teal)}
.mc .n{flex:none;width:46px;height:46px;border-radius:50%;background:var(--teal);color:var(--onteal);display:grid;place-items:center;font-weight:700;font-size:22px}
.mc.all{border-color:var(--amb)}.mc.all .n{background:var(--amb);color:var(--ambink)}
.mc b{display:block}.mc small{color:var(--mut);font-size:15px;display:block;line-height:1.3}
.mc .stt{margin-left:auto;color:var(--amb);font-size:20px;letter-spacing:2px;filter:saturate(1.2)}
.tip{color:var(--mut);font-size:15px;margin-top:18px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.back{border:0;background:none;color:var(--mut);font-size:15px;padding:8px 4px}
.bar{flex:1;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .4s}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-weight:700;font-size:15px;white-space:nowrap}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 14px;text-align:center}
.q{font-weight:700;margin:0 0 12px;display:flex;gap:10px;align-items:center;justify-content:center;text-align:left}
.sn{flex:none;width:32px;height:32px;border-radius:50%;background:var(--teal);color:var(--onteal);display:grid;place-items:center;font-size:17px}
.wd{display:flex;justify-content:center;align-items:center;margin:14px 0 18px;--f:min(42px,calc((min(100vw,640px) - 80px)/(var(--n)*1.4)))}
.L{font-size:var(--f);width:.8em;text-align:center;font-weight:700;line-height:1.5;color:var(--ink)}
.L.v{color:var(--teal)}
.g{position:relative;border:0;background:none;padding:0;width:.55em;height:1.5em;font-size:var(--f)}
.g:before{content:"";position:absolute;inset:-6px -8px}
.g:after{content:"";position:absolute;left:50%;top:10%;bottom:10%;border-left:2px dotted var(--mut);opacity:.6}
.g.on:after{border-left:5px solid var(--amb);border-radius:3px;opacity:1;margin-left:-2px}
.lock{pointer-events:none}
.sylrow{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:12px 0 14px}
.sw{text-align:center}
.sy{border:3px solid var(--teal);border-radius:14px;padding:10px 14px;font-size:30px;font-weight:700;background:var(--card);min-width:56px;transition:transform .15s}
.sy.tn{background:var(--amb);color:var(--ambink);border-color:var(--amb)}
.sy.over{transform:scale(1.1);border-color:var(--amb)}
.cap{font-size:14px;color:var(--mut);min-height:20px;margin-top:4px}
.vw{color:var(--teal);border-radius:6px;padding:0 1px}
.sy.tn .vw{color:var(--ambink)}
.vw.over{background:var(--amb);color:var(--ambink)}
.vw.tl{font-family:Georgia,serif}
.tray{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0;min-height:76px}
.tok{touch-action:none;user-select:none;-webkit-user-select:none;display:inline-flex;align-items:center;justify-content:center;width:70px;height:70px;border-radius:50%;background:var(--amb);color:var(--ambink);font:700 56px/1 Georgia,serif;box-shadow:0 4px 0 var(--sh);cursor:grab;padding-top:8px}
.tok.fz{width:auto;border-radius:40px;padding:0 22px;height:56px;font:700 19px "Atkinson Hyperlegible",Verdana,sans-serif}
.tok.sel{outline:4px solid var(--teal);outline-offset:3px}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:scale(1.15) rotate(-6deg);box-shadow:0 10px 18px rgba(0,0,0,.3)}
.zone{border:3px dashed var(--mut);border-radius:14px;padding:14px 16px;font-weight:700;color:var(--mut);transition:transform .15s}
.zone.over{border-color:var(--amb);color:var(--ink);transform:scale(1.08)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:6px}
.ch{min-width:128px;border:2px solid var(--teal);background:var(--card);border-radius:14px;padding:12px 14px;font-weight:700}
.ch.ok{background:var(--teal);color:var(--onteal)}
.ch:disabled{cursor:default;opacity:.55}.ch.ok:disabled{opacity:1}
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:700;background:var(--teal);color:var(--onteal)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--teal)}
.note{margin:6px 0;color:var(--mut)}.note b{color:var(--ink)}
.last{display:inline-block;min-width:1.5em;background:var(--amb);color:var(--ambink);border-radius:8px;padding:0 6px}
.chu{margin:10px 0;text-align:left;font-size:15px}
.chu summary{cursor:pointer;color:var(--teal);font-weight:700;text-align:center}
.chu table{border-collapse:collapse;width:100%;margin-top:8px}
.chu td,.chu th{border:1px solid var(--line);padding:5px 8px}
.chu th{background:var(--teal);color:var(--onteal);text-align:left}
.fb{margin:14px 0 10px;padding:11px 13px;border-radius:12px;font-weight:700;text-align:left}
.fb.ok{background:var(--okbg);color:var(--oktx);animation:pop .3s}
.fb.bad{background:var(--badbg);color:var(--badtx)}
.stars{font-size:60px;letter-spacing:8px;color:var(--amb);line-height:1.1}
.stars span{display:inline-block;animation:pop .5s both}.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}
h2{margin:6px 0 4px;font-size:26px}
.spk{border:2px solid var(--teal);background:var(--card);border-radius:30px;padding:9px 20px;font-weight:700;margin:0 0 4px}
.spk:active{background:var(--teal);color:var(--onteal)}
.spm{font-size:14px;color:var(--mut);margin-bottom:6px}
.sy.tp{font-family:inherit;color:var(--ink);cursor:pointer;line-height:1.2}
.sy.tp.tn{color:var(--ambink)}
.vb{border:0;border-bottom:3px dotted var(--teal);background:none;padding:0;cursor:pointer;font-family:inherit;border-radius:0}
.vb.tl{background:var(--amb);color:var(--ambink);border-bottom-color:transparent;border-radius:6px}
.fr{margin:8px 0;padding:10px 12px;border-radius:12px;text-align:left;font-size:16px;line-height:1.4}
.fr.ok{background:var(--okbg);color:var(--oktx)}
.fr.bad{background:var(--badbg);color:var(--badtx)}
.sy.tp.bad{background:var(--badbg);color:var(--badtx);border-color:var(--badtx)}
.ch.on{background:var(--teal);color:var(--onteal)}
.ch.no{background:var(--badbg);color:var(--badtx);border-color:var(--badtx)}
.bd{list-style:none;padding:0;margin:8px 0;text-align:left;display:inline-block}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
